# Ulak — Proof of Delivery
#   cp .env.example .env && docker compose up --build
#
#   web    -> http://localhost:8081   (ops panel; login +905550001122 / Ops12345!)
#   api    -> http://localhost:8080/swagger
#   minio  -> http://localhost:9001   (console; creds from .env)
#
# The MAUI driver app is built separately (see README) and points at the API.

name: ulak

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}"
        -C -No -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: src/Ulak.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-Ulak};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Ulak.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${DB_NAME:-Ulak};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ulak}
      Jwt__Audience: ${JWT_AUDIENCE:-ulak}
      Storage__Endpoint: ${MINIO_ENDPOINT:-http://minio:9000}
      Storage__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${MINIO_BUCKET:-proofs}
      Cors__AllowedOrigins__0: "http://localhost:8081"
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Ulak.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiClient__BaseUrl: "http://api:8080"
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  mssql-data:
  minio-data:
